# Render Blueprint: deploy the FastAPI backend from the repo root (quantum-lab/).
# After deploy, set CORS_ORIGINS to your Vercel URL, e.g. https://your-app.vercel.app
services:
  - type: web
    name: quantum-lab-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: PRODUCTION
        value: "true"
